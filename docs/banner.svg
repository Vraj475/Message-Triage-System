<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="300" fill="#0F1117"/>
  <rect opacity="0.05" width="1200" height="300" fill="url(#grid)"/>
  
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C8FFF"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Glow effect -->
  <circle cx="600" cy="150" r="120" fill="#6C8FFF" opacity="0.15" filter="url(#glow)"/>

  <!-- Logo Mark -->
  <g transform="translate(180, 90)">
    <rect width="120" height="120" rx="24" fill="#1A1D27" stroke="#2E3250" stroke-width="2"/>
    <path d="M68 20L28 68H64L60 100L100 52H64L68 20Z" fill="url(#accent-grad)" stroke="url(#accent-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Main Title -->
  <text x="330" y="145" fill="#E8EAF0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="56" letter-spacing="-1">TriageAI</text>
  <text x="330" y="185" fill="#8B90A8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="22" letter-spacing="0.5">Intelligent Customer Message Classification &amp; Evaluation System</text>

  <!-- Badges -->
  <g transform="translate(330, 210)">
    <rect width="110" height="28" rx="6" fill="#21253A" stroke="#2E3250"/>
    <text x="55" y="18" fill="#6C8FFF" font-family="sans-serif" font-weight="600" font-size="12" text-anchor="middle">REACT 18</text>

    <rect x="120" width="110" height="28" rx="6" fill="#21253A" stroke="#2E3250"/>
    <text x="175" y="18" fill="#3ECF8E" font-family="sans-serif" font-weight="600" font-size="12" text-anchor="middle">NODE 20</text>

    <rect x="240" width="130" height="28" rx="6" fill="#21253A" stroke="#2E3250"/>
    <text x="305" y="18" fill="#A78BFA" font-family="sans-serif" font-weight="600" font-size="12" text-anchor="middle">GEMINI / LLM</text>
  </g>
</svg>
